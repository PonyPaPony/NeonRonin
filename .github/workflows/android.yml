# Сборка APK для Android. Запускается при каждом push в main и вручную (вкладка Actions → Run workflow).
# Ручной запуск на другой ветке (например big-patch) собирает тестовый APK только как артефакт — в Releases он не попадает.
name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы выложить APK в раздел Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Capacitor
        run: npm install

      - name: Создать Android-проект
        run: npx cap add android

      - name: Иконки приложения
        run: npx capacitor-assets generate --android --iconBackgroundColor '#140c34' --splashBackgroundColor '#05060c'
        continue-on-error: true

      - name: Ориентация, полный экран, версия
        run: python3 scripts/patch_android.py ${{ github.run_number }}

      - name: Скопировать игру в Android-проект
        run: npx cap sync android

      - name: Собрать APK (с подписью, если заданы секреты)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$PWD/release.keystore"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../NeonRonin-1.${{ github.run_number }}.apk
          else
            echo "::warning::Секреты подписи не заданы — собираю отладочный APK. Обновлять его поверх старого не получится."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../NeonRonin-1.${{ github.run_number }}-debug.apk
          fi

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v6
        with:
          name: NeonRonin-APK
          path: NeonRonin-*.apk

      - name: Выложить в Releases (только из main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Неоновый Ронин 1.${{ github.run_number }}
          body: Сборка ${{ github.run_number }}. Скачай APK ниже и открой его на телефоне.
          files: NeonRonin-*.apk
